[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-level-image-editing"
version = "0.1.0"
description = "Model-agnostic pixel-preserving image editing for single and multi-round workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "gavin-sparkols" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
app = ["gradio>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pixel-edit = "pixel_level_editing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

